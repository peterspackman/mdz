[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "mdz"
dynamic = ["version"]
description = "Molecular dynamics trajectory compression with fast random access"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Spackman", email = "peterspackman@fastmail.com" }]
requires-python = ">=3.10"
keywords = ["molecular-dynamics", "compression", "trajectory", "science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/peterspackman/mdz-cpp"
Repository = "https://github.com/peterspackman/mdz-cpp"
Issues = "https://github.com/peterspackman/mdz-cpp/issues"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.entry-points.'OVITO.FileReader']
"MDZ Trajectory" = "mdz.ovito_reader:MdzFileReader"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["python/mdz"]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "CMakeLists.txt"
metadata.version.regex = 'project\(mdz\s+VERSION\s+(?P<value>[0-9][0-9.]*)'
sdist.exclude = ["fuzz", "build*", ".github", "tests/cpp/golden"]

[tool.scikit-build.cmake.define]
MDZ_BUILD_PYTHON = "ON"
MDZ_BUILD_CLI = "OFF"
MDZ_BUILD_TESTS = "OFF"
MDZ_BUILD_BENCH = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
